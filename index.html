<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda - Priscylla 💖</title>
<link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCEc2YHG6J2tpRZFHb9h6YmQSF6MtIpya0w7Yisi0wnw&s=10" sizes="32x32">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(180deg,#1a0a14 0%,#2d1026 30%,#000 100%);color:#fff;min-height:100vh;overflow-x:hidden;position:relative}

/* CORAÇÕES E PÉTALAS NO FUNDO */
.petala{position:fixed;top:-20px;pointer-events:none;z-index:1;animation:cair linear infinite;user-select:none}
@keyframes cair{
  0%{transform:translateY(-20px) translateX(0) rotate(0deg);opacity:0.8}
  100%{transform:translateY(110vh) translateX(100px) rotate(720deg);opacity:0}
}
.coracao-fundo{position:fixed;top:-20px;pointer-events:none;z-index:1;animation:coracaoCair linear infinite}
@keyframes coracaoCair{
  0%{transform:translateY(-20px) scale(0.5);opacity:0.6}
  50%{opacity:1}
  100%{transform:translateY(110vh) scale(1.2);opacity:0}
}

/* LOGIN */
.login-bg{position:fixed;inset:0;background:radial-gradient(circle at top,#ff69b4 0%,#c71585 20%,#1a0a14 60%,#000 100%);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;overflow:hidden}
.login-bg.oculto{display:none}
.login-box{background:linear-gradient(145deg,rgba(255,255,255,0.95),rgba(255,182,193,0.9));border:3px solid #ff69b4;border-radius:30px;padding:35px;width:100%;max-width:380px;box-shadow:0 0 60px rgba(255,105,180,0.6),0 0 100px rgba(255,20,147,0.3);backdrop-filter:blur(10px);position:relative;z-index:2}
.login-logo{font-size:30px;font-weight:900;letter-spacing:2px;text-align:center;margin-bottom:5px;background:linear-gradient(135deg,#ff1493,#ff69b4,#ffb6c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{color:#c71585;text-align:center;margin-bottom:20px;font-size:12px;letter-spacing:3px;font-weight:700}
.login-input{width:100%;padding:14px 18px;margin:10px 0;background:rgba(255,255,255,0.9);border:2px solid #ffb6c1;border-radius:20px;color:#8b0052;outline:none;font-size:15px;font-weight:600}
.login-input:focus{border-color:#ff1493;box-shadow:0 0 20px rgba(255,20,147,0.4)}
.login-input::placeholder{color:#ff69b4}
.btn-login{width:100%;background:linear-gradient(135deg,#ff1493,#ff69b4);border:none;padding:14px;border-radius:20px;color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:15px;box-shadow:0 5px 20px rgba(255,20,147,0.5);transition:0.3s}
.btn-login:hover{transform:scale(1.03);box-shadow:0 8px 30px rgba(255,20,147,0.7)}
.login-erro{color:#ff0040;text-align:center;margin-top:12px;font-size:12px;display:none;font-weight:800}
.login-erro.show{display:block}

/* HEADER FEMININO */
.header{background:linear-gradient(135deg,rgba(255,20,147,0.15),rgba(255,105,180,0.1),rgba(0,0,0,0.9));border-bottom:3px solid #ff69b4;padding:18px;position:sticky;top:0;z-index:100;backdrop-filter:blur(15px);box-shadow:0 4px 30px rgba(255,105,180,0.3);display:none}
.header.show{display:block}
.logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,#ff1493,#ffb6c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.search-box{position:relative;flex:1;max-width:400px}
.search-box input{width:100%;padding:12px 40px 12px 16px;background:rgba(255,255,255,0.1);border:2px solid #ff69b4;border-radius:30px;color:#fff;outline:none;backdrop-filter:blur(10px)}
.search-box input::placeholder{color:#ffb6c1}
.search-box input:focus{border-color:#ff1493;box-shadow:0 0 20px rgba(255,105,180,0.4)}
.search-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#ff69b4}
.btn-add{background:linear-gradient(135deg,#ff1493,#ff69b4);border:none;padding:10px 20px;border-radius:25px;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 15px rgba(255,20,147,0.4)}
.btn-sair{background:rgba(255,255,255,0.1);border:1px solid #ff69b4;color:#ffb6c1;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:12px}

.aniversario-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#ff1493,#ff69b4,#ffb6c1,#ff69b4);color:#fff;padding:14px;text-align:center;font-weight:900;font-size:16px;z-index:200;display:none;box-shadow:0 5px 20px rgba(255,20,147,0.5)}
.confetti{position:fixed;width:12px;height:12px;top:-10px;z-index:199;animation:fall linear;border-radius:50%}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.container{padding:20px;max-width:1400px;margin:0 auto;display:none;position:relative;z-index:2} .container.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
.card{background:linear-gradient(145deg,rgba(255,255,255,0.95),rgba(255,182,193,0.85));border:2px solid #ffb6c1;border-radius:25px;padding:20px;transition:0.3s;color:#8b0052;position:relative;overflow:hidden;box-shadow:0 8px 25px rgba(255,105,180,0.2)}
.card::before{content:'💖';position:absolute;top:10px;right:15px;font-size:18px;opacity:0.3}
.card:hover{border-color:#ff1493;transform:translateY(-5px) scale(1.02);box-shadow:0 15px 40px rgba(255,20,147,0.4)}
.card.aniversario-hoje{border:3px solid #ff1493;box-shadow:0 0 40px rgba(255,20,147,0.7);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(255,20,147,0.6)}50%{box-shadow:0 0 50px rgba(255,20,147,1)}}
.card-foto{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #ff69b4;margin:0 auto 12px;display:block;background:#fff;cursor:pointer;box-shadow:0 4px 15px rgba(255,105,180,0.3)}
.card-nome{font-size:19px;font-weight:900;text-align:center;margin-bottom:8px;color:#c71585}
.card-info{font-size:13px;color:#8b0052;margin:5px 0;display:flex;gap:6px;font-weight:600}
.card-info b{color:#ff1493;min-width:22px}
.card-actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:8px;border:none;border-radius:15px;font-weight:800;cursor:pointer;font-size:12px;transition:0.2s}
.btn-edit{background:linear-gradient(135deg,#ff69b4,#ffb6c1);color:#fff} .btn-foto{background:linear-gradient(135deg,#da70d6,#ff69b4);color:#fff} .btn-del{background:linear-gradient(135deg,#ff6b6b,#ff1493);color:#fff}
.btn:hover{transform:scale(1.05)}

.modal-bg{position:fixed;inset:0;background:rgba(26,10,20,0.9);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;backdrop-filter:blur(8px)} .modal-bg.ativo{display:flex}
.modal{background:linear-gradient(145deg,#fff,#ffd1dc);border:3px solid #ff69b4;border-radius:25px;padding:24px;width:100%;max-width:430px;box-shadow:0 20px 60px rgba(255,20,147,0.5)}
.modal h2{color:#c71585;text-align:center;margin-bottom:15px;font-weight:900} .modal input{width:100%;padding:11px 14px;margin:6px 0;background:rgba(255,255,255,0.9);border:2px solid #ffb6c1;border-radius:15px;color:#8b0052;outline:none;font-weight:600}
.modal input:focus{border-color:#ff1493}
.modal-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;margin:10px auto;display:block;border:3px solid #ff69b4;background:#fff;box-shadow:0 4px 15px rgba(255,105,180,0.3)}
.modal-btns{display:flex;gap:10px;margin-top:12px} .btn-salvar{flex:1;background:linear-gradient(135deg,#ff1493,#ff69b4);color:#fff;padding:11px;border:none;border-radius:15px;font-weight:900;cursor:pointer} .btn-cancel{flex:1;background:rgba(0,0,0,0.1);color:#8b0052;padding:11px;border:2px solid #ffb6c1;border-radius:15px;cursor:pointer;font-weight:700}
.vazio{text-align:center;padding:50px;color:#ffb6c1}
.vazio span{font-size:40px;display:block;margin-bottom:10px}
</style>
</head>
<body>

<div class="login-bg" id="telaLogin">
  <div class="login-box">
    <div class="login-logo">💖 AGENDA 💖</div>
    <div style="text-align:center;font-size:20px;font-weight:900;color:#ff1493;margin-bottom:5px">PRISCYLLA</div>
    <div class="login-sub">✨ Acesso Restrito ✨</div>
    <input type="text" id="loginUser" class="login-input" placeholder="💕 Usuário">
    <input type="password" id="loginPass" class="login-input" placeholder="🔑 Senha" onkeypress="if(event.key==='Enter') fazerLogin()">
    <button class="btn-login" onclick="fazerLogin()">💖 ENTRAR 💖</button>
    <div class="login-erro" id="loginErro">❌ Ops! Usuário ou senha errados 💔</div>
  </div>
</div>

<div class="aniversario-banner" id="bannerNiver"></div>

<div class="header" id="headerApp">
  <div class="header-top">
    <div class="logo">💖 AGENDA PRISCYLLA 💖</div>
    <div class="search-box"><input type="text" id="busca" placeholder="💕 Buscar contato..."><span class="search-icon">💖</span></div>
    <button class="btn-add" onclick="abrirModal()">💕 + NOVO</button>
    <button class="btn-sair" onclick="fazerLogout()">Sair 💔</button>
  </div>
</div>

<div class="container" id="containerApp">
  <div class="grid" id="grid"></div>
  <div class="vazio" id="vazio" style="display:none"><span>💌</span>Nenhum contato ainda<br><small>Clique em + NOVO para começar</small></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitulo">💖 Novo Contato 💖</h2>
    <img id="previewFoto" class="modal-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    <input type="file" id="inputFoto" accept="image/*" onchange="previewImagem(this)">
    <input type="text" id="fNome" placeholder="💕 Nome">
    <input type="tel" id="fNumero" placeholder="📞 Número">
    <input type="email" id="fEmail" placeholder="💌 E-mail">
    <input type="date" id="fAniver">
    <div class="modal-btns"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button><button class="btn-salvar" onclick="salvarContato()">💖 Salvar</button></div>
  </div>
</div>
<input type="file" id="inputFotoCard" accept="image/*" style="display:none" onchange="trocarFotoCard(this)">

<script>
const USUARIO_CORRETO="priscylla"; const SENHA_CORRETA="pietro";
const LINK_OFICIAL="https://script.google.com/macros/s/AKfycbx31MLntFpjIkxFcVe03_9OjvkI4EIWq2LJqjEv4lm--b5-_rrWjHQKlixJZRJIokb6/exec";
let contatos=[]; let editandoId=null; let fotoBase64=""; let fotoCardId=null;

// CRIA PÉTALAS E CORAÇÕES CAINDO NO FUNDO
function criarFundoRomantico(){
  setInterval(()=>{
    if(document.getElementById("telaLogin").classList.contains("oculto") && document.querySelectorAll(".petala").length>40) return;
    if(!document.getElementById("telaLogin").classList.contains("oculto") && document.querySelectorAll(".petala").length>25) return;

    let el = document.createElement("div");
    let tipo = Math.random();
    if(tipo<0.6){
      el.className="petala";
      el.innerHTML = ["🌸","🌹","🌺","💮","🏵️"][Math.floor(Math.random()*5)];
      el.style.fontSize = (Math.random()*15+12)+"px";
      el.style.left = Math.random()*100+"vw";
      el.style.animationDuration = (Math.random()*8+6)+"s";
    }else{
      el.className="coracao-fundo";
      el.innerHTML = ["💖","💕","💗","💓","💞","💝"][Math.floor(Math.random()*6)];
      el.style.fontSize = (Math.random()*14+10)+"px";
      el.style.left = Math.random()*100+"vw";
      el.style.animationDuration = (Math.random()*7+5)+"s";
    }
    el.style.animationDelay = Math.random()*2+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),12000);
  },400);
}
criarFundoRomantico();

function verificarLoginSalvo(){ if(localStorage.getItem("agenda_logado")==="priscylla_pietro"){ mostrarApp(); } }
function fazerLogin(){
  const u=document.getElementById("loginUser").value.trim().toLowerCase();
  const p=document.getElementById("loginPass").value.trim().toLowerCase();
  if(u===USUARIO_CORRETO && p===SENHA_CORRETA){ localStorage.setItem("agenda_logado","priscylla_pietro"); document.getElementById("loginErro").classList.remove("show"); mostrarApp(); }
  else{ document.getElementById("loginErro").classList.add("show"); }
}
function mostrarApp(){ document.getElementById("telaLogin").classList.add("oculto"); document.getElementById("headerApp").classList.add("show"); document.getElementById("containerApp").classList.add("show"); carregarContatos(); setInterval(()=>carregarContatos(true),3000); }
function fazerLogout(){ localStorage.removeItem("agenda_logado"); location.reload(); }

function api(acao,dados={}){ dados.acao=acao; return fetch(LINK_OFICIAL,{method:"POST",body:JSON.stringify(dados)}).then(r=>r.json()).catch(()=>fetch("",{method:"POST",body:JSON.stringify(dados)}).then(r=>r.json())); }
function carregarContatos(sil=false){ api("getContatos").then(res=>{ if(res.ok){ contatos=res.contatos; renderizar(); if(!sil) verificarAniversarios(); } }); }

function formatarData(d){
  if(!d) return "";
  try{
    var s = String(d).trim();
    if(s.indexOf("T")>-1){ var dt=new Date(s); var dia=dt.getUTCDate(); if(dia<10) dia="0"+dia; var mes=dt.getUTCMonth()+1; if(mes<10) mes="0"+mes; return dia+"/"+mes+"/"+dt.getUTCFullYear(); }
    if(s.indexOf("-")>-1){ var p=s.substring(0,10).split("-"); if(p.length==3 && p[0].length==4) return p[2]+"/"+p[1]+"/"+p[0]; }
    return s;
  }catch(e){ return d; }
}

function renderizar(){
  const busca=document.getElementById("busca").value.toLowerCase();
  const grid=document.getElementById("grid");
  const filtrados=contatos.filter(c=>c.nome.toLowerCase().includes(busca)||c.numero.includes(busca)||(c.email&&c.email.toLowerCase().includes(busca)));
  if(filtrados.length==0){ grid.innerHTML=""; document.getElementById("vazio").style.display="block"; return; }
  document.getElementById("vazio").style.display="none";
  const hoje=new Date(); const diaHoje=hoje.getDate(); const mesHoje=hoje.getMonth()+1;
  grid.innerHTML=filtrados.map(c=>{
    let ehHoje=false; if(c.aniversario){ try{ let s=String(c.aniversario); let d,m; if(s.indexOf("/")>-1){ let p=s.split("/"); d=parseInt(p[0]); m=parseInt(p[1]); } else if(s.indexOf("-")>-1){ let p=s.substring(0,10).split("-"); d=parseInt(p[2]); m=parseInt(p[1]); } if(d==diaHoje&&m==mesHoje) ehHoje=true; }catch(e){} }
    const foto=c.foto||"https://cdn-icons-png.flaticon.com/512/149/149071.png";
    return `<div class="card ${ehHoje?'aniversario-hoje':''}"><img class="card-foto" src="${foto}" onclick="abrirTrocaFoto('${c.id}')"><div class="card-nome">💖 ${c.nome} ${ehHoje?'🎂':''}</div><div class="card-info"><b>📞</b> ${c.numero}</div>${c.email?`<div class="card-info"><b>💌</b> ${c.email}</div>`:''}${c.aniversario?`<div class="card-info"><b>🎂</b> ${formatarData(c.aniversario)} ${ehHoje?'<span style="color:#ff1493;font-weight:900"> HOJE! 💖</span>':''}</div>`:''}<div class="card-actions"><button class="btn btn-edit" onclick="editar('${c.id}')">✏️ Editar</button><button class="btn btn-foto" onclick="abrirTrocaFoto('${c.id}')">📷 Foto</button><button class="btn btn-del" onclick="excluir('${c.id}')">🗑️ Excluir</button></div></div>`;
  }).join("");
}

function abrirModal(){ editandoId=null; fotoBase64=""; document.getElementById("modalTitulo").innerText="💖 Novo Contato 💖"; document.getElementById("fNome").value=""; document.getElementById("fNumero").value=""; document.getElementById("fEmail").value=""; document.getElementById("fAniver").value=""; document.getElementById("previewFoto").src="https://cdn-icons-png.flaticon.com/512/149/149071.png"; document.getElementById("modalBg").classList.add("ativo"); }
function fecharModal(){ document.getElementById("modalBg").classList.remove("ativo"); }
function previewImagem(i){ const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ fotoBase64=e.target.result; document.getElementById("previewFoto").src=fotoBase64; }; r.readAsDataURL(f); }
function salvarContato(){
  const nome=document.getElementById("fNome").value.trim(); const numero=document.getElementById("fNumero").value.trim(); const email=document.getElementById("fEmail").value.trim(); let aniversario=document.getElementById("fAniver").value;
  if(aniversario && aniversario.includes("-")){ let p=aniversario.split("-"); aniversario=p[2]+"/"+p[1]+"/"+p[0]; }
  if(!nome||!numero){ alert("💔 Nome e número são obrigatórios!"); return; }
  if(editandoId){ api("editContato",{id:editandoId,nome,numero,email,aniversario,foto:fotoBase64}).then(()=>{ fecharModal(); carregarContatos(); }); }
  else { api("addContato",{nome,numero,email,aniversario,foto:fotoBase64}).then(()=>{ fecharModal(); carregarContatos(); }); }
}
function editar(id){
  const c=contatos.find(x=>x.id==id); if(!c) return; editandoId=id; fotoBase64=c.foto||""; document.getElementById("modalTitulo").innerText="💖 Editar Contato 💖";
  document.getElementById("fNome").value=c.nome; document.getElementById("fNumero").value=c.numero; document.getElementById("fEmail").value=c.email;
  let dataInput=""; if(c.aniversario){ let s=String(c.aniversario); if(s.includes("/")){ let p=s.split("/"); if(p.length==3) dataInput=p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0"); } else if(s.includes("-")){ dataInput=s.substring(0,10); } }
  document.getElementById("fAniver").value=dataInput; document.getElementById("previewFoto").src=c.foto||"https://cdn-icons-png.flaticon.com/512/149/149071.png"; document.getElementById("modalBg").classList.add("ativo");
}
function excluir(id){ if(!confirm("💔 Tem certeza que quer excluir?")) return; api("deleteContato",{id}).then(()=>carregarContatos()); }
function abrirTrocaFoto(id){ fotoCardId=id; document.getElementById("inputFotoCard").click(); }
function trocarFotoCard(input){ const file=input.files[0]; if(!file||!fotoCardId) return; const reader=new FileReader(); reader.onload=e=>{ api("updateFoto",{id:fotoCardId,foto:e.target.result}).then(()=>carregarContatos()); }; reader.readAsDataURL(file); input.value=""; }
function verificarAniversarios(){
  const hoje=new Date(); const dia=hoje.getDate(); const mes=hoje.getMonth()+1; let an=[];
  contatos.forEach(c=>{ if(!c.aniversario) return; try{ let s=String(c.aniversario); let d,m; if(s.indexOf("/")>-1){ let p=s.split("/"); d=parseInt(p[0]); m=parseInt(p[1]); } else if(s.indexOf("-")>-1){ let p=s.substring(0,10).split("-"); d=parseInt(p[2]); m=parseInt(p[1]); } if(d==dia&&m==mes) an.push(c.nome); }catch(e){} });
  if(an.length>0){ const b=document.getElementById("bannerNiver"); b.innerHTML=`🎉💖 HOJE É ANIVERSÁRIO DE: ${an.join(", ")}! 💖🎉`; b.style.display="block"; soltarConfete(); setTimeout(()=>b.style.display="none",12000); }
}
function soltarConfete(){ const cores=["#ff1493","#ff69b4","#ffb6c1","#ffc0cb"]; for(let i=0;i<100;i++){ let conf=document.createElement("div"); conf.className="confetti"; conf.innerHTML = Math.random()>0.5 ? "💖" : "🌸"; conf.style.left=Math.random()*100+"vw"; conf.style.background="transparent"; conf.style.fontSize=(Math.random()*10+12)+"px"; conf.style.animationDuration=(Math.random()*3+2)+"s"; document.body.appendChild(conf); setTimeout(()=>conf.remove(),5000); } }

document.getElementById("busca").addEventListener("input", renderizar);
verificarLoginSalvo();
document.getElementById("modalBg").addEventListener("click", e=>{ if(e.target.id=="modalBg") fecharModal(); });
</script>
</body>
</html>
